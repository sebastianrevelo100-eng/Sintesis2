<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduMain</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <img class="imagen" src="https://i.im.ge/QM1SDNr/logo.png">
        <h1 class="textoLogin">Inicia sessió</h1>

        <form action="php/login.php" method="POST">
            <input class="inputCorreo" type="email" name="correo" placeholder="Correo electrónico" required><br><br>
            <input class="inputContraseña" type="password" name="contraseña" placeholder="Contraseña" required><br><br>
            <input class="botonSubmit" type="submit" value="Iniciar sessió">
            
        </form>

        <strong><a href="register.html" class="createAccButton">No tens compte?</a></strong>
    </div>
</body>
</html>
